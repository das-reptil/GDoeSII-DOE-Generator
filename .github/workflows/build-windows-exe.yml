name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/build-windows-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build DOE Generator EXE
        run: python -m PyInstaller --clean --noconfirm config\GDoeSII_DOE_Generator.spec

      - name: Build Film GS Batch EXE
        run: python -m PyInstaller --clean --noconfirm config\GDoeSII_Film_GS_Batch.spec

      - name: Verify EXEs
        shell: pwsh
        run: |
          $files = @(
            "dist\GDoeSII_DOE_Generator.exe",
            "dist\GDoeSII_Film_GS_Batch.exe"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "$file was not created"
            }
            Get-Item $file | Format-List FullName,Length,LastWriteTime
          }

      - name: Upload DOE Generator EXE
        uses: actions/upload-artifact@v7
        with:
          name: GDoeSII-DOE-Generator-Windows-x64
          path: dist/GDoeSII_DOE_Generator.exe
          if-no-files-found: error

      - name: Upload Film GS Batch EXE
        uses: actions/upload-artifact@v7
        with:
          name: GDoeSII-Film-GS-Batch-Windows-x64
          path: dist/GDoeSII_Film_GS_Batch.exe
          if-no-files-found: error
